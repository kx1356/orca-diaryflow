name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build plugin
        run: node build.mjs
      - name: Validate marketplace package
        run: node scripts/validate-marketplace-package.mjs
      - name: Check release essentials
        run: |
          test -f dist/index.js
          test -f plugin.json
          test -f package.json
          test -f LICENSE
          node -e "const p=require('./plugin.json'); const j=require('./package.json'); if(p.version!==j.version) process.exit(1)"
